name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project Life360.xcodeproj -scheme Life360 \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: import identity
        env:
          SIGN_P12_B64: ${{ secrets.SIGN_P12_B64 }}
          SIGN_P12_PASS: ${{ secrets.SIGN_P12_PASS }}
          SIGN_PROVISION_B64: ${{ secrets.SIGN_PROVISION_B64 }}
        run: |
          set -x
          exec > >(tee sign.log) 2>&1
          security delete-keychain sign.keychain 2>/dev/null || true
          security create-keychain -p actions sign.keychain
          security default-keychain -s sign.keychain
          security unlock-keychain -p actions sign.keychain
          security list-keychains -d user -s sign.keychain
          echo "$SIGN_P12_B64" | base64 -d > /tmp/sign.p12
          echo "$SIGN_PROVISION_B64" | base64 -d > /tmp/sign.mobileprovision
          security import AppleWWDRCAG3.cer -k sign.keychain -T /usr/bin/codesign
          security import /tmp/sign.p12 -k sign.keychain -P "$SIGN_P12_PASS" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k actions sign.keychain
          security find-identity -v -p codesigning sign.keychain || true
          ID=$(security find-identity -v -p codesigning sign.keychain | sed -n 's/^ *[0-9]*) \([0-9A-F]\{40\}\).*/\1/p' | head -1)
          test -n "$ID" || ID=$(security find-identity -p codesigning sign.keychain | sed -n 's/^ *[0-9]*) \([0-9A-F]\{40\}\).*/\1/p' | head -1)
          test -n "$ID" || { echo "NO IDENTITY"; exit 1; }
          echo "IDENTITY=$ID"
          echo "$ID" > identity.txt
      - name: sign with entitlements
        run: |
          set -e
          APP=$(find . -name '*.app' -path '*Release-iphoneos*' -not -path '*/Index/*' | head -1)
          test -n "$APP" || { echo "NO APP FOUND"; exit 1; }
          ID=$(cat identity.txt)
          echo "identity: $ID"
          cp /tmp/sign.mobileprovision "$APP/embedded.mobileprovision"
          for AX in $(find "$APP" -name '*.appex'); do
            echo "appex: [$AX]"
            cp /tmp/sign.mobileprovision "$AX/embedded.mobileprovision"
            case "$AX" in
              *Keyboard*) ENT=Keyboard.entitlements ;;
              *Screen*) ENT=Screen.entitlements ;;
              *) ENT=Life360.entitlements ;;
            esac
            codesign --force --sign "$ID" --timestamp=none --entitlements "$ENT" "$AX"
          done
          codesign --force --sign "$ID" --timestamp=none --entitlements Life360.entitlements "$APP"
          echo "--- entitlements ---"
          codesign -d --entitlements - "$APP"
      - name: package and manifest
        run: |
          set -e
          APP=$(find . -name '*.app' -path '*Release-iphoneos*' -not -path '*/Index/*' | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr Life360-signed.ipa Payload
          cat > manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict><key>items</key><array><dict>
          <key>assets</key><array><dict>
          <key>kind</key><string>software-package</string>
          <key>url</key><string>https://dunno-beep.github.io/life360-monitor/Life360-signed.ipa</string>
          </dict></array>
          <key>metadata</key><dict>
          <key>bundle-identifier</key><string>app.cassava9339.ivory1607</string>
          <key>bundle-version</key><string>2430000</string>
          <key>kind</key><string>software</string>
          <key>title</key><string>Monitor</string>
          </dict></dict></array></dict>
          </plist>
          PLIST
          ls -la Life360-signed.ipa manifest.plist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title latest --notes "rolling build"
          gh release upload latest Life360-signed.ipa manifest.plist --clobber
          echo "${{ github.sha }}" > version-ios.txt
          gh release upload latest version-ios.txt --clobber
      - name: upload log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title latest --notes rolling || true
          gh release upload latest sign.log --clobber || true
      - name: publish pages
        run: |
          set -e
          test -f Life360-signed.ipa
          mkdir -p docs
          cp Life360-signed.ipa manifest.plist docs/
          git config user.email "actions@users.noreply.github.com"
          git config user.name "actions"
          git add docs
          git commit -m "pages: ${{ github.sha }} [skip ci]" || true
          git push
